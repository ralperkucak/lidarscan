name: iOS build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Xcode surumu
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - name: XcodeGen kur ve proje uret
        run: brew install xcodegen && xcodegen
      - name: Derle (imzasiz, cihaz SDK)
        run: |
          set -o pipefail
          xcodebuild -project LiDARScan.xcodeproj -scheme LiDARScan \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log
      - name: Hatalari ozetle
        if: always()
        run: grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" build.log | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }
